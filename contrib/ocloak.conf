[daemon]
bind_addr = "127.0.0.1:1312"
## Optionally serve a static file for `GET /`
## Content-Type is text/plain, unless the file's first byte is `<`
#index_file = "contrib/index.html"

## Terminate TLS directly in ocloak
#[tls]
#cert_path = "/etc/ocloak/cert.pem"
#private_key_path = "/etc/ocloak/private_key.pem"

[defaults]
tls_handshake_timeout = "15s"
max_request_size = "8 MiB"
user_agent = "ohttp-relay"
connect_timeout = "15s"
read_timeout = "30s"
max_redirects = 2

## Allow specific hosts, the request path is pinned to the RFC default /.well-known/ohttp-gateway
#[[allowed]]
#hosts = ["example.com"]

## Allow specific hosts, the user may request arbitrary paths for their forwarded request
#[[allowed]]
#hosts = ["example.com"]
#arbitrary_paths = true

## Allow specific hosts with a fixed, non-default path
#[[allowed]]
#hosts = ["example.com"]
#path = "/.not-well-known/ohttp-gateway"

## Invert matching, request will get denied if matched
#[[allowed]]
#hosts = ["example.com"]
#deny = true

## Allow any host that indicates OHTTP support in their DNS HTTPS records
[[allowed]]
hosts = ["*"]
## Uses RFC-9540
require_dns_ohttp_discovery = true

## Everything else will be denied by default
